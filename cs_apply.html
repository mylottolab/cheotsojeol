<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>곡 등록 신청 — 첫소절</title><link rel="stylesheet" href="cs.css"><script src="cs.js"></script>
<style>
.stepper{display:flex;gap:6px;margin:20px 0 6px;flex-wrap:wrap}
.stepper span{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:800;background:var(--panel);color:var(--faint);border:1px solid var(--line)}
.stepper span.on{background:var(--gold);color:#1B1405;border-color:var(--gold)}
.stepper span.done{color:var(--mint)}
.box{padding:22px;max-width:760px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:1.5px dashed rgba(232,182,90,.55);border-radius:14px;padding:26px;text-align:center;color:var(--dim);font-size:14px;line-height:1.7;background:rgba(232,182,90,.05)}
.share{display:grid;grid-template-columns:1fr 1fr 90px;gap:8px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;background:var(--panel2)}
.opt input{margin-top:4px}.opt b{display:block;font-size:14.5px}.opt span{font-size:12.5px;color:var(--dim);line-height:1.6}
.agree{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.65;margin-top:12px;color:var(--dim)}
.nav2{display:flex;justify-content:space-between;margin-top:22px}
.warn{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(240,122,90,.10);border:1px solid rgba(240,122,90,.4);font-size:13px;line-height:1.7;color:#F7B9A8}
@media (max-width:640px){.row2{grid-template-columns:1fr}}
</style></head><body>
<main class="wrap">
  <div class="sect" style="margin-top:34px"><h2>곡 등록 신청</h2><span class="faint">작가용</span></div>
  <p class="muted" style="margin:0;line-height:1.8"><span class="tag mint">등록심사비 무료</span> 신청한 곡은 <b style="color:var(--text)">음원 자동 판별 → 작곡가 심사위원 심사</b>를 거쳐 공개됩니다. 보통 3~5일 걸리며, 결과는 알림으로 알려 드립니다.</p>
  <div class="stepper" id="stp"></div>
  <div class="card box" id="box"></div>
</main>
<script>
CS.top('cs_apply.html');
var step = 0;
var STEPS = ['① 곡 파일', '② 곡 정보', '③ 만든 사람', '④ 판매 조건', '⑤ 확인 · 제출'];
var PAGES = [
 '<label class="f">음원 파일</label><div class="drop">🎵 여기에 파일을 끌어다 놓거나 눌러서 고르세요<br><span class="faint">MP3 · WAV · 최대 50MB · 완성곡 또는 데모(가이드 보컬 포함 가능)</span></div>' +
 '<label class="f">가사</label><textarea class="in" placeholder="가사 전체를 붙여 넣어 주세요 (연주곡이면 비워 두세요)"></textarea>' +
 '<label class="f">창작 증빙 (선택)</label><div class="drop" style="padding:16px">작업 파일(프로젝트 · 악보 · 녹음 기록) 사진이나 파일 — 표절 분쟁 때 작가님을 지켜 줍니다</div>',
 '<div class="row2"><div><label class="f">곡 제목</label><input class="in" placeholder="예) 새벽 세 시의 고백"></div><div><label class="f">장르</label><select class="in">' + CS.GENRES.slice(1).map(function(g){ return '<option>' + g + '</option>'; }).join('') + '</select></div></div>' +
 '<div class="row2"><div><label class="f">분위기</label><input class="in" placeholder="예) 잔잔한, 몽환적"></div><div><label class="f">빠르기 · 조</label><input class="in" placeholder="예) 72 BPM · E♭"></div></div>' +
 '<label class="f">곡 소개</label><textarea class="in" placeholder="어떤 가수 · 어떤 쓰임에 어울리는지, 편곡 · 수정이 가능한지 등"></textarea>',
 '<label class="f">참여한 사람과 지분</label><div class="hint" style="margin-top:0">공동 창작곡은 참여자 전원의 동의가 필요합니다. 지분 합계는 100%여야 합니다.</div>' +
 '<div class="share"><input class="in" value="윤슬 (나)"><select class="in"><option>작사 · 작곡</option><option>작사</option><option>작곡</option><option>편곡</option></select><input class="in" value="100%"></div>' +
 '<button class="btn ghost" style="margin-top:8px;padding:9px 14px;font-size:13.5px">＋ 참여자 추가</button>' +
 '<label class="f">[필수] 한국음악저작권협회(KOMCA) · 함께하는음악저작권협회(KOSCAP) 등 저작권 신탁단체의 회원이신가요?</label><select class="in"><option value="">선택해 주세요</option><option>아니요</option><option>예 — KOMCA</option><option>예 — KOSCAP</option><option>예 — 그 밖의 단체</option></select>' +
 '<div class="warn">신탁단체 회원이 만든 곡은 만드는 순간 단체에 신탁되어, 작가님이 직접 넘기거나 독점으로 허락할 수 없습니다. 회원이시면 협회의 <b>신탁범위선택제 · 곡별 신탁 제외</b>로 이 곡이 제외되었다는 <b>증빙</b>을 올려 주셔야 등록할 수 있습니다.</div>' +
 '<label class="f">신탁 제외 증빙 (회원만)</label><div class="drop" style="padding:16px">협회에서 받은 신탁 제외 확인서 · 화면 캡처</div>',
 '<label class="f">판매 방식 (여러 개 고를 수 있어요)</label>' +
 '<label class="opt"><input type="checkbox" checked><div><b>양도</b><span>곡의 저작재산권을 구매자에게 넘깁니다. 성명표시권 등 저작인격권은 작가님께 남습니다.</span></div></label>' +
 '<label class="opt"><input type="checkbox" checked><div><b>독점 이용허락</b><span>권리는 작가님께 두고, 정한 기간 · 범위 동안 한 구매자만 쓰게 합니다.</span></div></label>' +
 '<label class="opt"><input type="checkbox"><div><b>비독점 이용허락</b><span>여러 구매자가 함께 쓸 수 있게 합니다. 광고 · 영상 배경음악에 많이 씁니다.</span></div></label>' +
 '<div class="row2"><div><label class="f">희망 판매가 (원)</label><input class="in" value="3,000,000"></div><div><label class="f">가격 협상</label><select class="in"><option>협상 받기</option><option>정가로만 판매</option></select></div></div>' +
 '<label class="f">15초 무료 미리듣기</label><label class="opt"><input type="checkbox"><div><b>미리듣기 허용</b><span>로그인한 회원에게 이 곡의 15초만 낮은 음질로 들려줍니다(중간에 첫소절 음성 표시). 구매자를 끌어오는 데 도움이 됩니다. 허용하지 않으면 청취권이 있는 회원만 듣습니다.</span></div></label>' +
 '<div class="row2"><div><label class="f">미리듣기 시작 지점</label><input class="in" placeholder="예) 1:05 (후렴 시작)"></div><div></div></div>' +
 '<div class="hint">거래가 이뤄지면 수수료 20%와 그 부가세(거래가의 2%)를 뺀 금액이 정산됩니다. 예) 300만 원 → 234만 원(개인은 원천징수 별도).</div>',
 '<div style="line-height:1.9;font-size:14.5px"><b>제출 전에 확인해 주세요</b></div>' +
 '<label class="agree"><input type="checkbox"> 이 곡은 제가 직접 만들었으며(공동 창작이면 참여자 전원이 동의했으며), 다른 곡을 베끼지 않았습니다.</label>' +
 '<label class="agree"><input type="checkbox"> 이 곡을 다른 곳에 독점으로 넘기거나 계약하지 않았습니다.</label>' +
 '<label class="agree"><input type="checkbox"> 표절 · 권리 침해가 확인되면 곡이 내려가고, 그로 인한 책임은 제게 있음을 압니다.</label>' +
 '<label class="agree"><input type="checkbox"> 작가 약관과 수수료(20% + 부가세)에 동의합니다.</label>' +
 '<div class="hint" style="margin-top:14px">제출하면 ① 음원 자동 판별(발표곡과 같은지 확인) → ② 작곡가 심사위원의 음악성 · 표절 심사 순서로 진행됩니다.</div>'
];
function paint(){
  document.getElementById('stp').innerHTML = STEPS.map(function(x, i){ return '<span class="' + (i === step ? 'on' : i < step ? 'done' : '') + '">' + (i < step ? '✓ ' : '') + x + '</span>'; }).join('');
  document.getElementById('box').innerHTML = PAGES[step] + '<div class="nav2"><button class="btn ghost" id="pv"' + (step ? '' : ' style="visibility:hidden"') + '>‹ 이전</button><button class="btn gold" id="nx">' + (step === STEPS.length - 1 ? '심사 신청하기' : '다음 ›') + '</button></div>';
  document.getElementById('pv').onclick = function(){ step--; paint(); };
  document.getElementById('nx').onclick = function(){ if (step < STEPS.length - 1) { step++; paint(); } else { document.getElementById('box').innerHTML = '<div style="text-align:center;padding:30px 10px;line-height:1.9"><div style="font-size:40px">🎼</div><b style="font-size:19px">신청이 접수되었습니다</b><br><span class="muted">음원 자동 판별을 시작했습니다. 심사 결과는 3~5일 안에 알려 드립니다.</span><br><a class="btn" style="margin-top:16px" href="cs_admin.html">(미리보기) 심사함에서 보기 ›</a></div>'; } };
}
paint();
</script></body></html>
