<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-en="Submit a song — Cheotsojeol">곡 등록 신청 — 첫소절</title><link rel="stylesheet" href="cs.css?v=20261027c"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="cs_config.js?v=20261027c"></script><script src="cs.js?v=20261027c"></script>
<style>
.stepper{display:flex;gap:6px;margin:20px 0 6px;flex-wrap:wrap}
.stepper span{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:800;background:var(--panel);color:var(--faint);border:1px solid var(--line)}
.stepper span.on{background:var(--gold);color:#1B1405;border-color:var(--gold)}
.stepper span.done{color:var(--mint)}
.box{padding:22px;max-width:760px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:1.5px dashed rgba(232,182,90,.55);border-radius:14px;padding:26px;text-align:center;color:var(--dim);font-size:14px;line-height:1.7;background:rgba(232,182,90,.05)}
.share{display:grid;grid-template-columns:1fr 1fr 90px;gap:8px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;background:var(--panel2)}
.opt input{margin-top:4px}.opt b{display:block;font-size:14.5px}.opt span{font-size:12.5px;color:var(--dim);line-height:1.6}
.agree{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.65;margin-top:12px;color:var(--dim)}
.nav2{display:flex;justify-content:space-between;margin-top:22px}
.warn{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(240,122,90,.10);border:1px solid rgba(240,122,90,.4);font-size:13px;line-height:1.7;color:#F7B9A8}
html[data-mode=light] .warn{color:#A2412A}
.err{margin-top:12px;color:var(--coral);font-size:13.5px;line-height:1.6;min-height:1em}
.file{display:block;cursor:pointer}.file input{display:none}.file.ok{border-color:var(--mint);color:var(--mint)}
.mine td .tag{white-space:nowrap}
.share .x{background:none;border:none;color:var(--faint);font-size:18px;cursor:pointer}
.share{grid-template-columns:1fr 1fr 80px 28px}
@media (max-width:640px){.row2{grid-template-columns:1fr}.share{grid-template-columns:1fr 1fr}}
</style></head><body>
<main class="wrap">
  <div class="sect" style="margin-top:34px"><h2 data-en="Submit a song">곡 등록 신청</h2><span class="faint" data-en="For songwriters">작가용</span></div>
  <p class="muted" style="margin:0;line-height:1.8" data-en="<span class=&quot;tag mint&quot;>No review fee</span> Submitted songs go public after <b style=&quot;color:var(--text)&quot;>automatic audio matching → review by professional composers</b>. It usually takes 3–5 days; see the result under “My submissions” on this page."><span class="tag mint">등록심사비 무료</span> 신청한 곡은 <b style="color:var(--text)">음원 자동 판별 → 작곡가 심사위원 심사</b>를 거쳐 공개됩니다. 보통 3~5일 걸리며, 결과는 이 화면의 「내 신청곡」에서 볼 수 있습니다.</p>
  <div id="mine"></div>
  <div class="stepper" id="stp"></div>
  <div class="card box" id="box"><span class="faint" data-en="Loading…">불러오는 중…</span></div>
</main>
<script>
CS.top('cs_apply.html');
var T = CS.T, EN = CS.lang === 'en';
var ME = null, step = 0, D = { credits: [], modes: ['transfer','exclusive'], negotiable: true };
var STEPS = [T('① 곡 파일', '① Audio'), T('② 곡 정보', '② Details'), T('③ 만든 사람', '③ Credits'), T('④ 판매 조건', '④ Terms'), T('⑤ 확인 · 제출', '⑤ Submit')];
var ST = { submitted:[T('접수','Received'),'gold'], auto_checked:[T('자동 판별 끝','Auto-checked'),'gold'], in_review:[T('심사 중','In review'),'violet'], needs_fix:[T('보완 요청','Changes requested'),'coral'], rejected:[T('반려','Rejected'),'coral'], listed:[T('공개 중','Live'),'mint'], paused:[T('잠시 숨김','Hidden'),'coral'], sold:[T('거래 완료','Sold'),'mint'] };
var ROLES = [['lyrics_music',T('작사 · 작곡','Lyrics · Music')],['lyrics',T('작사','Lyrics')],['music',T('작곡','Music')],['arrange',T('편곡','Arrangement')]];
var box = document.getElementById('box'), E = CS.esc;
function $(i){ return document.getElementById(i); }
function err(t){ var e = $('err'); if (e) e.textContent = t || ''; return false; }
function val(i){ var e = $(i); return e ? e.value.trim() : ''; }
function sec(t){ var m = String(t || '').match(/^(\d+):(\d{1,2})$/); return m ? (+m[1]) * 60 + (+m[2]) : (/^\d+$/.test(t || '') ? +t : null); }
function fileBox(id, label, f, accept){ return '<label class="drop file' + (f ? ' ok' : '') + '" id="' + id + 'L"><input type="file" id="' + id + '" accept="' + accept + '">' + (f ? '✓ ' + E(f.name) + ' <span class="faint">(' + T('바꾸려면 누르세요', 'tap to change') + ')</span>' : label) + '</label>'; }
function bindFile(id, key, max, cb){ var e = $(id); if (!e) return; e.onchange = function(){ var f = e.files[0]; if (!f) return; if (f.size > max) { err(T('파일이 너무 큽니다(최대 ', 'File too large (max ') + Math.round(max / 1048576) + 'MB).'); return; } D[key] = f; if (cb) cb(f); paint(); }; }

/* ── 내 신청곡 ── */
async function loadMine(){
  var r = await CS.sb.from('cs_songs').select('id,title,status,reject_reason,created_at,listed_at,unlist_requested_at,unlist_due,unlist_kind').eq('author_id', ME.user.id).order('created_at', { ascending: false });
  var L = r.data || [], DAY = 864e5;
  function ymd(t){ return t ? String(t).slice(0, 10) : ''; }
  function extra(s){
    if (s.status !== 'listed') return '';
    var minEnd = new Date(new Date(s.listed_at || s.created_at).getTime() + 60 * DAY).toISOString();
    if (s.unlist_requested_at) return '<div class="hint">' + (s.unlist_kind === 'normal'
        ? T('⏳ 내리기 예약 · <b>' + ymd(s.unlist_due) + '</b>에 자동으로 내려갑니다', '⏳ Removal scheduled · goes offline on <b>' + ymd(s.unlist_due) + '</b>')
        : T('⏳ 예외 내림 요청 · 운영진이 확인 중입니다', '⏳ Exception request · under review by our team')) +
      ' <a href="#" data-cancel="' + s.id + '" style="color:var(--gold)">' + T('요청 취소', 'Cancel request') + '</a></div>';
    return '<div class="hint">' + (minEnd > new Date().toISOString() ? T('최소 게재 기간 · ' + ymd(minEnd) + '까지', 'Minimum listing period · until ' + ymd(minEnd)) : T('최소 게재 기간 지남 · 언제든 내릴 수 있습니다', 'Minimum period over · you can remove it anytime')) +
      ' · <a href="#" data-unlist="' + s.id + '" data-end="' + ymd(minEnd) + '" style="color:var(--gold)">' + T('내리기 요청', 'Request removal') + '</a></div>';
  }
  $('mine').innerHTML = L.length ? '<div class="sect" style="margin:22px 0 8px"><h2 style="font-size:17px">' + T('내 신청곡', 'My submissions') + '</h2><span class="faint">' + T(L.length + '곡', L.length + (L.length === 1 ? ' song' : ' songs')) + '</span></div><div class="card" style="padding:4px 14px;max-width:760px"><table class="t mine">' +
    L.map(function(s){ var st = ST[s.status] || [s.status, '']; return '<tr><td><b>' + E(s.title) + '</b>' + (s.reject_reason && s.status !== 'listed' ? '<div class="hint">' + T('사유: ', 'Reason: ') + E(s.reject_reason) + '</div>' : '') + extra(s) + '</td><td><span class="tag ' + st[1] + '">' + st[0] + '</span></td><td class="faint">' + s.created_at.slice(0, 10) + '</td></tr>'; }).join('') + '</table></div>' : '';
  document.querySelectorAll('[data-cancel]').forEach(function(a){ a.onclick = async function(e){ e.preventDefault();
    if (!confirm(T('내리기 요청을 취소할까요? 곡은 계속 공개됩니다.', 'Cancel the removal request? The song stays online.'))) return;
    await CS.sb.rpc('cs_song_unlist_cancel', { p_song: a.dataset.cancel }); loadMine(); }; });
  document.querySelectorAll('[data-unlist]').forEach(function(a){ a.onclick = function(e){ e.preventDefault(); unlistBox(a.dataset.unlist, a.dataset.end); }; });
}
/* 내리기 요청: 최소 게재 기간(60일) 중이면 그날 자동으로 내려가고, 예외 사유는 운영진이 확인 뒤 바로 내립니다 */
function unlistBox(id, end){
  var past = end <= new Date().toISOString().slice(0, 10), m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="card"><h2 style="font-size:19px">' + T('곡 내리기 요청', 'Request removal') + '</h2>' +
    '<p class="muted" style="font-size:13.5px;line-height:1.75;margin:8px 0 0">' + (past ? T('최소 게재 기간(60일)이 지나 <b style="color:var(--text)">바로 내려갑니다</b>.', 'The 60-day minimum period is over, so the song <b style="color:var(--text)">goes offline now</b>.')
      : T('공개된 곡은 청취권 회원을 위해 <b style="color:var(--text)">최소 60일</b> 게재합니다(작가 약관 4). 지금 요청하면 <b style="color:var(--text)">' + end + '</b>에 자동으로 내려갑니다. 그 기간에는 첫소절 밖에서 이 곡을 양도 · 독점 계약할 수 없습니다.', 'Live songs stay online for at least <b style="color:var(--text)">60 days</b> for pass holders (Songwriter Terms 4). If you request now, it goes offline on <b style="color:var(--text)">' + end + '</b>. Until then you may not sell or exclusively license it outside Cheotsojeol.')) + '</p>' +
    '<label class="f">' + T('요청 종류', 'Type') + '</label><select class="in" id="uk"><option value="normal">' + (past ? T('일반 — 지금 내리기', 'Normal — remove now') : T('일반 — 기간이 끝나는 날 내리기', 'Normal — remove when the period ends')) + '</option>' +
    (past ? '' : '<option value="legal">' + T('예외 — 법령 위반 우려', 'Exception — possible legal violation') + '</option><option value="dispute">' + T('예외 — 권리 분쟁 · 다툼', 'Exception — rights dispute') + '</option><option value="other">' + T('예외 — 부득이한 사유(건강 등)', 'Exception — unavoidable reason (health, etc.)') + '</option>') + '</select>' +
    '<div id="ukr" style="display:none"><label class="f">' + T('사유 (10자 이상 · 운영진이 확인 후 바로 내립니다)', 'Reason (10+ characters · our team reviews and removes it promptly)') + '</label><textarea class="in" id="ur" maxlength="2000"></textarea></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px"><button class="btn" id="ux">' + T('닫기', 'Close') + '</button><button class="btn coral" id="us">' + T('요청하기', 'Submit') + '</button></div><div class="err" id="uerr"></div></div>';
  document.body.appendChild(m);
  m.querySelector('#uk').onchange = function(){ m.querySelector('#ukr').style.display = this.value === 'normal' ? 'none' : ''; };
  m.querySelector('#ux').onclick = function(){ m.remove(); };
  m.querySelector('#us').onclick = async function(){
    var k = m.querySelector('#uk').value, rs = m.querySelector('#ur').value.trim();
    if (k !== 'normal' && rs.length < 10) { m.querySelector('#uerr').textContent = T('사유를 10자 이상 적어 주세요.', 'Please write at least 10 characters.'); return; }
    var r = await CS.sb.rpc('cs_song_unlist', { p_song: id, p_kind: k, p_reason: rs || null }), d = r.data || {};
    if (r.error || !d.ok) { m.querySelector('#uerr').textContent = T('요청하지 못했습니다: ', 'Could not submit: ') + (r.error ? r.error.message : d.error); return; }
    m.remove(); alert(d.done ? T('곡을 내렸습니다.', 'The song is now offline.') : d.review ? T('예외 요청을 접수했습니다. 운영진이 확인 후 처리합니다.', 'Your exception request was received. Our team will review it.') : T(String(d.due).slice(0, 10) + '에 자동으로 내려갑니다.', 'It will go offline on ' + String(d.due).slice(0, 10) + '.'));
    loadMine();
  };
}

/* ── 작가 등록(처음 한 번) ── */
function authorForm(){
  $('stp').innerHTML = '';
  var TAXO = [['business', T('사업소득 3.3% — 전문 작가', 'Korean resident · business income 3.3%'), T('작곡 · 작사를 직업으로 하거나, 곡을 계속해서 판매하는 분', 'Professional songwriters living in Korea who sell songs regularly')],
              ['other_income', T('기타소득 8.8% — 어쩌다 한두 번', 'Korean resident · other income 8.8%'), T('본업이 따로 있고, 곡을 가끔 일시적으로 판매하는 분', 'Korean residents with another main job who sell songs only occasionally')],
              ['company', T('사업자 — 세금계산서 발행', 'Registered business (Korea) — tax invoice'), T('개인사업자 · 법인 (원천징수 없이 세금계산서로 정산)', 'Sole proprietors or companies in Korea (settled by tax invoice, no withholding)')],
              ['nonresident', T('해외 거주자 — 외국 작가', 'Non-resident — songwriter living outside Korea'), T('한국에 살지 않는 작가 (한국 세법에 따라 원천징수 · 조세조약 세율은 거주자증명서 제출 시 적용)', 'Korean withholding tax applies under Korean tax law; a reduced treaty rate applies if you submit a certificate of tax residence')]];
  if (EN) TAXO.unshift(TAXO.pop());
  box.innerHTML = '<h2 style="font-size:19px">' + T('먼저 작가 등록을 해 주세요', 'First, create your songwriter profile') + ' <span class="faint" style="font-size:13px">(' + T('처음 한 번', 'one time') + ')</span></h2>' +
    '<label class="f">' + T('작가 이름 (곡 카드에 보이는 이름)', 'Artist name (shown on song cards)') + '</label><input class="in" id="dn" maxlength="30" value="' + E(ME.profile.nickname) + '">' +
    '<label class="f">' + T('작가 소개 (선택)', 'About you (optional)') + '</label><textarea class="in" id="bio" maxlength="1000" placeholder="' + T('주로 만드는 장르, 경력, 편곡 · 수정 가능 여부 등', 'Main genres, credits, whether you can arrange or revise, etc.') + '"></textarea>' +
    '<label class="f">' + T('[필수] 한국음악저작권협회(KOMCA) · 함께하는음악저작권협회(KOSCAP) 등 저작권 신탁단체의 회원이신가요?', '[Required] Are you a member of a collecting society that manages your copyrights (e.g. KOMCA, KOSCAP, ASCAP, BMI, PRS, JASRAC)?') + '</label><select class="in" id="tr"><option value="">' + T('선택해 주세요', 'Please choose') + '</option><option value="no">' + T('아니요', 'No') + '</option><option value="KOMCA">' + T('예 — KOMCA', 'Yes — KOMCA') + '</option><option value="KOSCAP">' + T('예 — KOSCAP', 'Yes — KOSCAP') + '</option><option value="other">' + T('예 — 그 밖의 단체', 'Yes — another society') + '</option></select>' +
    '<div class="warn">' + T('신탁단체 회원이 만든 곡은 만드는 순간 단체에 신탁되어, 작가님이 직접 넘기거나 독점으로 허락할 수 없습니다. 회원이시면 곡을 올릴 때마다 협회의 <b>신탁범위선택제 · 곡별 신탁 제외</b>로 그 곡이 제외되었다는 <b>증빙</b>을 함께 올려 주셔야 합니다.',
      'If you belong to a collecting society, your new songs may be assigned to it automatically, and you cannot sell or exclusively license them yourself. Members must upload <b>proof that the song is excluded</b> from the society’s mandate (e.g. a per-work exclusion) with every submission.') + '</div>' +
    '<label class="f">' + T('[필수] 정산 받을 때의 세금 구분 — 작가님이 직접 골라 주세요', '[Required] Your tax status for payouts — please choose') + '</label>' +
    TAXO.map(function(x){ return '<label class="opt"><input type="radio" name="tax" value="' + x[0] + '"><div><b>' + x[1] + '</b><span>' + x[2] + '</span></div></label>'; }).join('') +
    '<div class="hint">' + T('고른 구분대로 세금을 떼고 지급합니다. 사정이 바뀌면 나중에 바꿀 수 있습니다. 어느 쪽인지 모르시면 세무서나 세무사에게 확인해 주세요. 실제와 다르게 골라 생기는 세금 문제는 작가님 책임입니다.', 'We withhold tax according to your choice; you can change it later. If unsure, ask a tax adviser. You are responsible for any tax issue caused by choosing a status that does not match your situation.') + '</div>' +
    '<label class="agree"><input type="checkbox" id="ag1"> ' + T('[필수] <a href="cs_terms.html#author" target="_blank" style="text-decoration:underline">작가 약관</a>에 동의합니다.', '[Required] I agree to the <a href="cs_terms.html#author" target="_blank" style="text-decoration:underline">Songwriter Terms</a>.') + '</label>' +
    '<label class="agree"><input type="checkbox" id="ag2"> ' + T('[필수] 심사를 통과한 곡을 첫소절이 청취권 회원에게 들려주고 검토용 파일로 제공하는 것을 허락하며, 그 대가로 청취 · 다운로드 매출의 78%를 이용료로 받는 데 동의합니다.', '[Required] I allow Cheotsojeol to stream my approved songs to pass holders and provide review copies, and I agree to receive 78% of listening and download revenue as a license fee.') + '</label>' +
    '<div class="nav2"><span></span><button class="btn gold" id="go">' + T('작가 등록하기', 'Create profile') + '</button></div><div class="err" id="err"></div>';
  $('go').onclick = async function(){
    var tr = val('tr'), tax = (document.querySelector('input[name=tax]:checked') || {}).value;
    if (!val('dn')) return err(T('작가 이름을 넣어 주세요.', 'Please enter your artist name.'));
    if (!tr) return err(T('신탁단체 회원인지 골라 주세요.', 'Please answer the collecting-society question.'));
    if (!tax) return err(T('세금 구분을 골라 주세요.', 'Please choose your tax status.'));
    if (!$('ag1').checked || !$('ag2').checked) return err(T('필수 항목에 모두 동의해 주세요.', 'Please accept all required items.'));
    this.disabled = true;
    var r = await CS.sb.from('cs_authors').insert({ user_id: ME.user.id, display_name: val('dn'), bio: val('bio') || null,
      trust_member: tr !== 'no', trust_society: tr === 'no' ? null : tr, tax_type: tax, tax_declared_at: new Date().toISOString() });
    this.disabled = false;
    if (r.error) return err(T('저장하지 못했습니다: ', 'Could not save: ') + r.error.message);
    ME = await CS.me(true); paint();
  };
}

/* ── 곡 신청 단계 ── */
function page(){
  if (step === 0) return '<label class="f">' + T('음원 파일 (필수)', 'Audio file (required)') + '</label>' + fileBox('au', T('🎵 눌러서 음원 파일을 고르세요<br><span class="faint">MP3 · WAV · M4A · 최대 50MB · 완성곡 또는 데모(가이드 보컬 포함 가능)</span>', '🎵 Tap to choose your audio file<br><span class="faint">MP3 · WAV · M4A · up to 50MB · finished song or demo (guide vocal OK)</span>'), D.audio, 'audio/*') +
    (D.length_sec ? '<div class="hint">' + T('길이 ', 'Length ') + Math.floor(D.length_sec / 60) + ':' + ('0' + D.length_sec % 60).slice(-2) + '</div>' : '') +
    '<label class="f">' + T('가사', 'Lyrics') + '</label><textarea class="in" id="ly" maxlength="8000" placeholder="' + T('가사 전체를 붙여 넣어 주세요 (연주곡이면 비워 두세요)', 'Paste the full lyrics (leave empty for instrumentals)') + '">' + E(D.lyrics) + '</textarea>' +

    return err(M[res.error] || (T('신청하지 못했습니다: ', 'Could not submit: ') + (r.error ? r.error.message : res.error))); }
  $('stp').innerHTML = '';
  box.innerHTML = '<div style="text-align:center;padding:30px 10px;line-height:1.9"><div style="font-size:40px">🎼</div><b style="font-size:19px">' + T('신청이 접수되었습니다', 'Submission received') + '</b><br><span class="muted">「' + E(D.title) + '」 — ' + T('음원 자동 판별 뒤 작곡가 심사위원이 심사합니다. 결과는 3~5일 안에 「내 신청곡」에서 볼 수 있습니다.', 'After automatic matching, professional composers will review it. See the result under “My submissions” within 3–5 days.') + E(pvNote) + '</span><br><button class="btn" style="margin-top:16px" onclick="location.reload()">' + T('다른 곡 신청하기', 'Submit another song') + '</button></div>';
  loadMine();
}
function paint(){
  if (!ME.author) return authorForm();
  $('stp').innerHTML = STEPS.map(function(x, i){ return '<span class="' + (i === step ? 'on' : i < step ? 'done' : '') + '">' + (i < step ? '✓ ' : '') + x + '</span>'; }).join('');
  box.innerHTML = page() + '<div class="nav2"><button class="btn ghost" id="pv0"' + (step ? '' : ' style="visibility:hidden"') + '>' + T('‹ 이전', '‹ Back') + '</button><button class="btn gold" id="nx">' + (step === STEPS.length - 1 ? T('심사 신청하기', 'Submit for review') : T('다음 ›', 'Next ›')) + '</button></div><div class="err" id="err"></div>';
  bindFile('au', 'audio', 52428800, function(f){ D.length_sec = null; var u = URL.createObjectURL(f), el = new Audio(); el.preload = 'metadata'; el.onloadedmetadata = function(){ if (isFinite(el.duration)) { D.length_sec = Math.round(el.duration); if (step === 0) paint(); } URL.revokeObjectURL(u); }; el.src = u; });
  bindFile('ev', 'evidence', 52428800); bindFile('tp', 'trust', 52428800);
  if ($('add')) $('add').onclick = function(){ readCredits(); D.credits.push({ name: '', role: 'lyrics_music', share_pct: 0 }); paint(); };
  document.querySelectorAll('.share .x').forEach(function(b){ b.onclick = function(){ readCredits(); D.credits.splice(+b.dataset.i, 1); paint(); }; });
  $('pv0').onclick = function(){ if (step === 2) readCredits(); if (step === 0) D.lyrics = val('ly'); step--; paint(); };
  $('nx').onclick = function(){ if (step === STEPS.length - 1) return submit(this); if (collect() === true) { step++; paint(); scrollTo(0, 0); } };
}
(async function(){
  if (!CS.sb) { box.innerHTML = '<p class="err">' + T('연결 준비가 덜 되었습니다.', 'Not connected yet.') + '</p>'; return; }
  ME = await CS.needLogin(); if (!ME) return;
  D.credits = [{ name: (ME.author ? ME.author.display_name : ME.profile.nickname) + T(' (나)', ' (me)'), role: 'lyrics_music', share_pct: 100 }];
  D.genre = CS.GENRES[1];
  if (ME.author) loadMine();
  paint();
})();
</script></body></html>
