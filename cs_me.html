<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-en="My page — Cheotsojeol">내 정보 — 첫소절</title><link rel="stylesheet" href="cs.css?v=20261026e"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="cs_config.js?v=20261026e"></script><script src="cs.js?v=20261026e"></script>
<style>
.box{max-width:560px;padding:22px;margin-top:14px}
.box h3{font-size:16px;margin-bottom:4px}
.row{display:flex;gap:8px;margin-top:8px}.row .in{flex:1}
.err{margin-top:8px;font-size:13px;min-height:1em;color:var(--coral)}.ok{color:var(--mint)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;line-height:1.7}.kv span{color:var(--faint)}
</style></head><body>
<main class="wrap"><div class="sect" style="margin-top:34px"><h2 data-en="My page">내 정보</h2></div><div id="app"><span class="faint" data-en="Loading…">불러오는 중…</span></div></main>
<script>
CS.top('');
var E = CS.esc, T = CS.T, ME;
var TAX = { business:T('사업소득 3.3%','Business income 3.3%'), other_income:T('기타소득 8.8%','Other income 8.8%'), company:T('사업자(세금계산서)','Registered business (tax invoice)'), nonresident:T('해외 거주자','Non-resident (overseas)') }, KIND = { '7d':T('7일','7-day'), '15d':T('15일','15-day'), '30d':T('30일','30-day') };
function $(i){ return document.getElementById(i); }
function msg(id, t, ok){ var e = $(id); e.textContent = t || ''; e.className = 'err' + (ok ? ' ok' : ''); }
async function paint(){
  var ps = await CS.sb.from('cs_passes').select('kind,starts_at,ends_at').gte('ends_at', new Date().toISOString()).order('ends_at', { ascending: false }).limit(3);
  var P = ps.data || [], a = ME.author;
  $('app').innerHTML =
   '<div class="card box"><h3>' + T('계정', 'Account') + '</h3><div class="kv" style="margin-top:8px"><span>' + T('이메일', 'Email') + '</span><b>' + E(ME.user.email) + '</b><span>' + T('별명', 'Nickname') + '</span><b>' + E(ME.profile.nickname) + '</b>' + (ME.profile.role !== 'user' ? '<span>' + T('권한', 'Role') + '</span><b>' + (ME.profile.role === 'admin' ? T('관리자', 'Admin') : T('심사위원', 'Reviewer')) + '</b>' : '') + '</div>' +
   '<label class="f">' + T('별명 바꾸기', 'Change nickname') + '</label><div class="row"><input class="in" id="nk" maxlength="20" value="' + E(ME.profile.nickname) + '"><button class="btn" id="nkb">' + T('저장', 'Save') + '</button></div><div class="err" id="nke"></div></div>' +
   '<div class="card box"><h3>' + T('청취권', 'Listening pass') + '</h3>' + (P.length ? P.map(function(p){ return '<div style="margin-top:6px">✅ ' + T(KIND[p.kind] + ' 청취권 · <b>' + p.ends_at.slice(0, 10) + '</b>까지', KIND[p.kind] + ' pass · until <b>' + p.ends_at.slice(0, 10) + '</b>') + '</div>'; }).join('') : '<div class="muted" style="margin-top:6px">' + T('지금 쓸 수 있는 청취권이 없습니다.', 'You have no active pass.') + ' <a href="cs_pass.html" style="color:var(--gold)">' + T('청취권 보기 ›', 'See passes ›') + '</a></div>') + '</div>' +
   (a ? '<div class="card box"><h3>' + T('작가 정보', 'Songwriter profile') + '</h3><div class="kv" style="margin-top:8px"><span>' + T('작가 이름', 'Artist name') + '</span><b>' + E(a.display_name) + '</b><span>' + T('신탁단체', 'Collecting society') + '</span><b>' + (a.trust_member ? T('회원', 'Member') + '(' + E(a.trust_society) + ')' : T('비회원', 'Not a member')) + '</b><span>' + T('세금 구분', 'Tax type') + '</span><b>' + TAX[a.tax_type] + '</b></div>' +
     '<label class="f">' + T('세금 구분 바꾸기', 'Change tax type') + '</label><div class="row"><select class="in" id="tx">' + Object.keys(TAX).map(function(k){ return '<option value="' + k + '"' + (k === a.tax_type ? ' selected' : '') + '>' + TAX[k] + '</option>'; }).join('') + '</select><button class="btn" id="txb">' + T('저장', 'Save') + '</button></div><div class="err" id="txe"></div>' +
     '<div class="hint">' + T('신탁단체 회원 여부를 바꾸려면 weapps.kr@gmail.com 으로 알려 주세요(확인 후 바꿔 드립니다).', 'To change your collecting-society membership, email weapps.kr@gmail.com (we update it after checking).') + ' <a href="cs_apply.html" style="color:var(--gold)">' + T('내 신청곡 보기 ›', 'My submissions ›') + '</a></div><a class="btn gold" href="cs_payout.html" style="margin-top:12px">' + T('💳 정산 정보 · 정산 내역', '💳 Payout details · history') + '</a></div>' : '') +
   '<div class="card box"><h3>' + T('비밀번호', 'Password') + '</h3><p class="muted" style="font-size:13.5px;margin:4px 0 0;line-height:1.7">' + T('만들어 두면 다음부터 메일 없이 이메일 + 비밀번호로 로그인합니다.', 'With a password you can log in with email + password, no email code needed.') + '</p>' +
     '<div class="row"><input class="in" id="p1" type="password" placeholder="' + T('새 비밀번호 (8자 이상)', 'New password (8+ characters)') + '" autocomplete="new-password"><input class="in" id="p2" type="password" placeholder="' + T('한 번 더', 'Confirm') + '" autocomplete="new-password"></div><button class="btn" id="pwb" style="margin-top:8px">' + T('비밀번호 저장', 'Save password') + '</button><div class="err" id="pwe"></div></div>' +
   '<div class="card box"><button class="btn" id="out" style="width:100%">' + T('로그아웃', 'Log out') + '</button></div>' +
   '<div class="card box"><h3>' + T('회원 탈퇴', 'Delete account') + '</h3><p class="muted" style="font-size:13.5px;line-height:1.75;margin:6px 0 0">' + T('탈퇴하면 계정 · 별명 · 작가 정보 · <b style="color:var(--text)">올린 곡</b> · 남은 청취권이 모두 지워지고 되살릴 수 없습니다. 결제 기록과 들은 시간 기록은 법에 따라 누구인지 알 수 없게 5년 보관합니다. 남은 청취권은 환불되지 않으니 필요하면 먼저 문의해 주세요.', 'Deleting your account permanently removes your account, nickname, songwriter profile, <b style="color:var(--text)">uploaded songs</b> and any remaining pass. Payment and listening records are kept anonymized for 5 years as required by law. Remaining passes are not refunded — contact us first if needed.') + '</p>' +
     '<label class="f">' + T('탈퇴하려면 아래 칸에 <b style="color:var(--coral)">탈퇴</b> 라고 적어 주세요', 'To confirm, type <b style="color:var(--coral)">DELETE</b> below') + '</label><div class="row"><input class="in" id="dc" placeholder="' + T('탈퇴', 'DELETE') + '"><button class="btn coral" id="del">' + T('탈퇴하기', 'Delete account') + '</button></div><div class="err" id="dele"></div></div>';
  $('nkb').onclick = async function(){ var v = $('nk').value.trim(); if (v.length < 2) return msg('nke', T('별명은 2자 이상입니다.', 'Nickname must be at least 2 characters.'));
    var r = await CS.sb.from('cs_profiles').update({ nickname: v }).eq('id', ME.user.id); if (r.error) return msg('nke', T('저장하지 못했습니다: ', 'Could not save: ') + r.error.message);
    msg('nke', T('저장했습니다 ✓', 'Saved ✓'), true); ME = await CS.me(true); };
  if ($('txb')) $('txb').onclick = async function(){ var r = await CS.sb.from('cs_authors').update({ tax_type: $('tx').value }).eq('user_id', ME.user.id);
    if (r.error) return msg('txe', T('저장하지 못했습니다: ', 'Could not save: ') + r.error.message); var tv = $('tx').value; msg('txe', (tv === 'other_income' || tv === 'company') ? T('요청했습니다. 관리자 확인 뒤 적용되며, 그 전까지는 사업소득 3.3%로 계산합니다.', 'Requested. It applies after our review; until then business income 3.3% is used.') : T('저장했습니다 ✓', 'Saved ✓'), true); ME = await CS.me(true); };
  $('pwb').onclick = async function(){ var a1 = $('p1').value, a2 = $('p2').value; if (a1.length < 8) return msg('pwe', T('8자 이상으로 만들어 주세요.', 'Use at least 8 characters.')); if (a1 !== a2) return msg('pwe', T('두 칸이 다릅니다.', 'The passwords don’t match.'));
    var r = await CS.sb.auth.updateUser({ password: a1, data: { has_pw: true } }); if (r.error) return msg('pwe', /reauth|recent/i.test(r.error.message) ? T('보안을 위해 로그아웃 후 메일 번호로 다시 로그인한 뒤 바꿔 주세요.', 'For security, log out, log back in with an email code, then change it.') : T('저장하지 못했습니다: ', 'Could not save: ') + r.error.message);
    $('p1').value = $('p2').value = ''; msg('pwe', T('비밀번호를 저장했습니다 ✓', 'Password saved ✓'), true); };
  $('out').onclick = async function(){ await CS.sb.auth.signOut(); location.href = 'cs_index.html'; };
  $('del').onclick = async function(){ if ($('dc').value.trim().toUpperCase() !== T('탈퇴', 'DELETE')) return msg('dele', T('칸에 「탈퇴」라고 적어 주세요.', 'Please type DELETE in the box.'));
    if (!confirm(T('정말 탈퇴할까요? 되돌릴 수 없습니다.', 'Really delete your account? This cannot be undone.'))) return;
    var r = await CS.sb.rpc('cs_delete_me', { p_confirm: '탈퇴' }), d = r.data || {};
    if (r.error || !d.ok) return msg('dele', d.error === 'admin' ? T('관리자 계정은 여기서 탈퇴할 수 없습니다.', 'Admin accounts cannot be deleted here.') : T('탈퇴하지 못했습니다: ', 'Could not delete: ') + (r.error ? r.error.message : d.error));
    await CS.sb.auth.signOut(); $('app').innerHTML = '<div class="card box"><h3>' + T('탈퇴했습니다', 'Your account was deleted') + '</h3><p class="muted">' + T('그동안 첫소절을 이용해 주셔서 감사합니다.', 'Thank you for using Cheotsojeol.') + '</p><a class="btn" href="cs_index.html">' + T('처음으로', 'Home') + '</a></div>'; };
}
(async function(){ ME = await CS.needLogin(); if (ME) paint(); })();
</script></body></html>
