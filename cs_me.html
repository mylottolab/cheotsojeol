<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 정보 — 첫소절</title><link rel="stylesheet" href="cs.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="cs_config.js"></script><script src="cs.js"></script>
<style>
.box{max-width:560px;padding:22px;margin-top:14px}
.box h3{font-size:16px;margin-bottom:4px}
.row{display:flex;gap:8px;margin-top:8px}.row .in{flex:1}
.err{margin-top:8px;font-size:13px;min-height:1em;color:var(--coral)}.ok{color:var(--mint)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;line-height:1.7}.kv span{color:var(--faint)}
</style></head><body>
<main class="wrap"><div class="sect" style="margin-top:34px"><h2>내 정보</h2></div><div id="app"><span class="faint">불러오는 중…</span></div></main>
<script>
CS.top('');
var E = CS.esc, ME;
var TAX = { business:'사업소득 3.3%', other_income:'기타소득 8.8%', company:'사업자(세금계산서)' }, KIND = { '7d':'7일', '15d':'15일', '30d':'30일' };
function $(i){ return document.getElementById(i); }
function msg(id, t, ok){ var e = $(id); e.textContent = t || ''; e.className = 'err' + (ok ? ' ok' : ''); }
async function paint(){
  var ps = await CS.sb.from('cs_passes').select('kind,starts_at,ends_at').gte('ends_at', new Date().toISOString()).order('ends_at', { ascending: false }).limit(3);
  var P = ps.data || [], a = ME.author;
  $('app').innerHTML =
   '<div class="card box"><h3>계정</h3><div class="kv" style="margin-top:8px"><span>이메일</span><b>' + E(ME.user.email) + '</b><span>별명</span><b>' + E(ME.profile.nickname) + '</b>' + (ME.profile.role !== 'user' ? '<span>권한</span><b>' + (ME.profile.role === 'admin' ? '관리자' : '심사위원') + '</b>' : '') + '</div>' +
   '<label class="f">별명 바꾸기</label><div class="row"><input class="in" id="nk" maxlength="20" value="' + E(ME.profile.nickname) + '"><button class="btn" id="nkb">저장</button></div><div class="err" id="nke"></div></div>' +
   '<div class="card box"><h3>청취권</h3>' + (P.length ? P.map(function(p){ return '<div style="margin-top:6px">✅ ' + KIND[p.kind] + ' 청취권 · <b>' + p.ends_at.slice(0, 10) + '</b>까지</div>'; }).join('') : '<div class="muted" style="margin-top:6px">지금 쓸 수 있는 청취권이 없습니다. <a href="cs_pass.html" style="color:var(--gold)">청취권 보기 ›</a></div>') + '</div>' +
   (a ? '<div class="card box"><h3>작가 정보</h3><div class="kv" style="margin-top:8px"><span>작가 이름</span><b>' + E(a.display_name) + '</b><span>신탁단체</span><b>' + (a.trust_member ? '회원(' + E(a.trust_society) + ')' : '비회원') + '</b><span>세금 구분</span><b>' + TAX[a.tax_type] + '</b></div>' +
     '<label class="f">세금 구분 바꾸기</label><div class="row"><select class="in" id="tx">' + Object.keys(TAX).map(function(k){ return '<option value="' + k + '"' + (k === a.tax_type ? ' selected' : '') + '>' + TAX[k] + '</option>'; }).join('') + '</select><button class="btn" id="txb">저장</button></div><div class="err" id="txe"></div>' +
     '<div class="hint">신탁단체 회원 여부를 바꾸려면 weapps.kr@gmail.com 으로 알려 주세요(확인 후 바꿔 드립니다). <a href="cs_apply.html" style="color:var(--gold)">내 신청곡 보기 ›</a></div></div>' : '') +
   '<div class="card box"><h3>비밀번호</h3><p class="muted" style="font-size:13.5px;margin:4px 0 0;line-height:1.7">만들어 두면 다음부터 메일 없이 이메일 + 비밀번호로 로그인합니다.</p>' +
     '<div class="row"><input class="in" id="p1" type="password" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password"><input class="in" id="p2" type="password" placeholder="한 번 더" autocomplete="new-password"></div><button class="btn" id="pwb" style="margin-top:8px">비밀번호 저장</button><div class="err" id="pwe"></div></div>' +
   '<div class="card box"><button class="btn" id="out" style="width:100%">로그아웃</button></div>' +
   '<div class="card box"><h3>회원 탈퇴</h3><p class="muted" style="font-size:13.5px;line-height:1.75;margin:6px 0 0">탈퇴하면 계정 · 별명 · 작가 정보 · <b style="color:var(--text)">올린 곡</b> · 남은 청취권이 모두 지워지고 되살릴 수 없습니다. 결제 기록과 들은 시간 기록은 법에 따라 누구인지 알 수 없게 5년 보관합니다. 남은 청취권은 환불되지 않으니 필요하면 먼저 문의해 주세요.</p>' +
     '<label class="f">탈퇴하려면 아래 칸에 <b style="color:var(--coral)">탈퇴</b> 라고 적어 주세요</label><div class="row"><input class="in" id="dc" placeholder="탈퇴"><button class="btn coral" id="del">탈퇴하기</button></div><div class="err" id="dele"></div></div>';
  $('nkb').onclick = async function(){ var v = $('nk').value.trim(); if (v.length < 2) return msg('nke', '별명은 2자 이상입니다.');
    var r = await CS.sb.from('cs_profiles').update({ nickname: v }).eq('id', ME.user.id); if (r.error) return msg('nke', '저장하지 못했습니다: ' + r.error.message);
    msg('nke', '저장했습니다 ✓', true); ME = await CS.me(true); };
  if ($('txb')) $('txb').onclick = async function(){ var r = await CS.sb.from('cs_authors').update({ tax_type: $('tx').value, tax_declared_at: new Date().toISOString() }).eq('user_id', ME.user.id);
    if (r.error) return msg('txe', '저장하지 못했습니다: ' + r.error.message); msg('txe', '저장했습니다 ✓', true); ME = await CS.me(true); };
  $('pwb').onclick = async function(){ var a1 = $('p1').value, a2 = $('p2').value; if (a1.length < 8) return msg('pwe', '8자 이상으로 만들어 주세요.'); if (a1 !== a2) return msg('pwe', '두 칸이 다릅니다.');
    var r = await CS.sb.auth.updateUser({ password: a1, data: { has_pw: true } }); if (r.error) return msg('pwe', /reauth|recent/i.test(r.error.message) ? '보안을 위해 로그아웃 후 메일 번호로 다시 로그인한 뒤 바꿔 주세요.' : '저장하지 못했습니다: ' + r.error.message);
    $('p1').value = $('p2').value = ''; msg('pwe', '비밀번호를 저장했습니다 ✓', true); };
  $('out').onclick = async function(){ await CS.sb.auth.signOut(); location.href = 'cs_index.html'; };
  $('del').onclick = async function(){ if ($('dc').value.trim() !== '탈퇴') return msg('dele', '칸에 「탈퇴」라고 적어 주세요.');
    if (!confirm('정말 탈퇴할까요? 되돌릴 수 없습니다.')) return;
    var r = await CS.sb.rpc('cs_delete_me', { p_confirm: '탈퇴' }), d = r.data || {};
    if (r.error || !d.ok) return msg('dele', d.error === 'admin' ? '관리자 계정은 여기서 탈퇴할 수 없습니다.' : '탈퇴하지 못했습니다: ' + (r.error ? r.error.message : d.error));
    await CS.sb.auth.signOut(); $('app').innerHTML = '<div class="card box"><h3>탈퇴했습니다</h3><p class="muted">그동안 첫소절을 이용해 주셔서 감사합니다.</p><a class="btn" href="cs_index.html">처음으로</a></div>'; };
}
(async function(){ ME = await CS.needLogin(); if (ME) paint(); })();
</script></body></html>
