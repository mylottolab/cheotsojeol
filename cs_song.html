<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>곡 정보 — 첫소절</title><link rel="stylesheet" href="cs.css"><script src="cs.js"></script>
<style>
.head{display:grid;grid-template-columns:360px 1fr;gap:26px;margin-top:26px}
.cover{border-radius:18px;aspect-ratio:1/1;position:relative;display:flex;align-items:flex-end;padding:18px;overflow:hidden}
.cover .tag{position:relative;z-index:2}
.cover .wave{position:absolute;left:18px;right:18px;bottom:22px;display:flex;gap:3px;align-items:flex-end;height:70px;opacity:.6}
.cover .wave i{flex:1;border-radius:2px;background:#fff}
.info h1{font-size:32px;font-weight:900;line-height:1.3}
.info .by{font-size:15px;color:var(--dim);margin-top:6px}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.specs div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--faint)}
.specs b{display:block;font-size:15.5px;color:var(--text);margin-top:3px}
.player{padding:16px;margin:4px 0 16px}
.player .row{display:flex;align-items:center;gap:12px}
.player .pb{width:48px;height:48px;border-radius:50%;background:var(--gold);color:#1B1405;font-size:18px;font-weight:900;border:none;cursor:pointer}
.player .track{flex:1;height:44px;display:flex;gap:2px;align-items:center}
.player .track i{flex:1;border-radius:2px;background:rgba(255,255,255,.18)}
.player .track i.on{background:var(--gold)}
.lock{margin-top:10px;font-size:13px;color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.buy{padding:18px}
.buy .p{font-size:28px;font-weight:900;color:var(--gold)}
.buy .acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.lyrics{padding:18px;line-height:2;font-size:15px;position:relative;white-space:pre-line}
.lyrics.blur{filter:blur(5px);user-select:none;max-height:150px;overflow:hidden}
.lockcover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.head,.two{grid-template-columns:1fr}.specs{grid-template-columns:1fr 1fr}.cover{aspect-ratio:1.6/1}}
</style></head><body>
<main class="wrap" id="main"></main>
<script>
CS.top('cs_index.html');
var id = new URLSearchParams(location.search).get('id') || 's01';
var s = CS.SONGS.filter(function(x){ return x.id === id; })[0] || CS.SONGS[0];
var hasPass = new URLSearchParams(location.search).get('pass') === '1';
document.title = s.t + ' — 첫소절';
document.getElementById('main').innerHTML =
 '<div class="head"><div class="cover" style="' + CS.art(s) + '"><div class="wave">' + CS.wave(CS.SONGS.indexOf(s) + 1, 46) + '</div>' + (s.isNew ? '<span class="tag coral" style="position:relative">NEW</span>' : '') + '</div>' +
 '<div class="info"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag">' + s.genre + '</span><span class="tag">' + s.mood + '</span><span class="tag mint">심사 통과</span></div>' +
 '<h1 style="margin-top:10px">' + s.t + '</h1><div class="by">작사 · 작곡 <b style="color:var(--text)">' + s.by + '</b> · 등록 2026.10</div>' +
 '<div class="specs"><div>길이<b>' + s.len + '</b></div><div>빠르기<b>' + s.bpm + ' BPM</b></div><div>조<b>' + s.key + '</b></div><div>들은 횟수<b>' + s.plays.toLocaleString() + '</b></div></div>' +
 '<div class="card player"><div class="row"><button class="pb" id="pb">▶</button><div class="track" id="track">' + CS.wave(3, 60).replace(/<i /g, '<i ') + '</div><span class="faint" id="tm">0:00 / ' + s.len + '</span></div>' +
 '<div class="lock">' + (hasPass ? '✅ 청취권으로 전체 듣는 중' : (s.pv ? '▶ 작가가 허락한 15초 미리듣기(로그인 회원 · 하루 횟수 제한) · ' : '') + '🔒 전체 듣기는 청취권이 필요합니다 <a class="btn gold" style="padding:7px 12px;font-size:13px" href="cs_pass.html">청취권 보기</a>') + '</div></div>' +
 '<div class="card buy"><div class="faint" style="font-size:13px">작가 희망가</div><div class="p">' + CS.won(s.price) + '</div>' +
 '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' + s.mode.map(CS.modeTag).join('') + '</div>' +
 '<div class="acts"><a class="btn coral" href="cs_talk.html?id=' + s.id + '">💬 협상 요청</a><a class="btn" href="#">⬇ 검토용 다운로드 550원</a></div>' +
 '<p class="hint">검토용 파일에는 구매자를 알아볼 수 있는 표시가 들어가며, 듣고 검토하는 데만 쓸 수 있습니다. 곡의 권리는 계약을 마칠 때까지 작가에게 있습니다.</p></div></div></div>' +
 '<div class="two" style="margin-top:22px"><div><div class="sect" style="margin-top:6px"><h2>가사</h2></div><div class="card" style="position:relative;overflow:hidden"><div class="lyrics' + (hasPass ? '' : ' blur') + '">창밖엔 아직 어둠이 남아\n잠들지 못한 마음을 적어\n세 시의 고요 속에서\n너에게만 들리게 말할게\n\n(가사 예시 — 미리보기)</div>' + (hasPass ? '' : '<div class="lockcover">🔒 청취권이 있으면 가사 전체를 볼 수 있어요</div>') + '</div></div>' +
 '<div><div class="sect" style="margin-top:6px"><h2>작가 소개</h2></div><div class="card" style="padding:18px;line-height:1.8;font-size:14.5px"><b>' + s.by + '</b> <span class="tag gold">본인 확인</span> <span class="tag">음저협 비회원</span><br><span class="muted">발라드와 어쿠스틱 중심으로 작업합니다. 녹음 · 편곡 데모 포함. 수정 요청에 맞춰 드립니다. (소개 예시)</span><div style="margin-top:12px" class="faint">등록곡 4 · 거래 완료 1</div></div></div></div>';
var playing = false, pos = 0, t = null;
document.getElementById('pb').onclick = function(){
  if (!hasPass && !s.pv) { document.getElementById('tm').textContent = '🔒 청취권이 있어야 들을 수 있어요'; return; }
  playing = !playing; this.textContent = playing ? '❚❚' : '▶';
  clearInterval(t);
  if (playing) t = setInterval(function(){ var bars = document.querySelectorAll('#track i'); var lim = hasPass ? bars.length : Math.max(3, Math.round(bars.length * 15 / (parseInt(s.len) * 60 + parseInt(s.len.split(':')[1]))));
    pos = Math.min(pos + 1, lim); bars.forEach(function(b, i){ b.classList.toggle('on', i < pos); });
    if (pos >= lim) { clearInterval(t); playing = false; document.getElementById('pb').textContent = '▶'; if (!hasPass) document.getElementById('tm').textContent = '15초 미리듣기 끝 · 청취권으로 전체 듣기'; } }, 120);
};
</script></body></html>
