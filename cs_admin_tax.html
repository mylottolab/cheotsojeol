<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>정산 · 세무 — 첫소절 관리자</title><link rel="stylesheet" href="cs.css?v=20261026b"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="cs_config.js?v=20261026b"></script><script src="cs.js?v=20261026b"></script>
<style>
.tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.pane{padding:18px;margin-top:14px;overflow-x:auto}
table.t td,table.t th{font-size:13px;white-space:nowrap}
table.t td.n,table.t th.n{text-align:right}
.mini{padding:6px 10px;font-size:12.5px}
.err{margin-top:8px;font-size:13px;min-height:1em;color:var(--coral)}.ok{color:var(--mint)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.note{font-size:12.5px;color:var(--faint);line-height:1.7}
</style></head><body>
<main class="wrap">
  <div class="sect" style="margin-top:34px"><h2>정산 · 세무</h2><span class="faint">관리자</span><a class="btn" href="cs_admin.html" style="margin-left:auto;padding:8px 14px;font-size:13.5px">‹ 심사함</a></div>
  <div id="app"><span class="faint">불러오는 중…</span></div>
</main>
<script>
CS.top('cs_admin.html');
var E = CS.esc, ME, TAB = 'month', AU = [], RATES = [], SET = [], PERIOD;
var TAX = { business:'사업소득 3.3%', other_income:'기타소득 8.8%', company:'사업자', nonresident:'해외 거주자' };
var ST = { draft:'계산됨(미확정)', confirmed:'확정 · 지급 예정', paid:'지급 완료', failed:'이체 실패', held:'보류' };
function $(i){ return document.getElementById(i); }
function msg(t, ok){ var e = $('err'); if (e) { e.textContent = t || ''; e.className = 'err' + (ok ? ' ok' : ''); } }
function n(x){ return (+x || 0).toLocaleString(); }
function lastMonth(){ var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return d.toISOString().slice(0, 7); }
PERIOD = lastMonth();
async function signed(p){ if (!p) return null; var r = await CS.sb.storage.from('cs-audio').createSignedUrl(p, 600); return r.data ? r.data.signedUrl : null; }
function csv(name, rows){
  var s = '﻿' + rows.map(function(r){ return r.map(function(c){ c = c == null ? '' : String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click();
}
async function loadAll(){
  var a = await CS.sb.rpc('cs_admin_authors'); AU = a.data || [];
  var r = await CS.sb.from('cs_tax_rates').select('*').order('country'); RATES = r.data || [];
  var s = await CS.sb.from('cs_settlements').select('*').eq('period', PERIOD + '-01').order('net_krw', { ascending: false }); SET = s.data || [];
  paint();
}
function paint(){
  var pend = AU.filter(function(a){ return a.tax_status === 'pending'; }).length, tp = AU.filter(function(a){ return a.treaty_status === 'pending'; }).length;
  $('app').innerHTML = '<div class="tabs">' + [['month','월 정산'],['tax','소득 구분 승인' + (pend ? ' ' + pend : '')],['nr','해외 작가 서류' + (tp ? ' ' + tp : '')],['rate','나라별 세율표'],['all','작가 세무 정보']].map(function(t){ return '<span class="chip' + (t[0] === TAB ? ' on' : '') + '" data-t="' + t[0] + '">' + t[1] + '</span>'; }).join('') + '</div>' +
    '<div class="card pane">' + ({ month: paneMonth, tax: paneTax, nr: paneNR, rate: paneRate, all: paneAll })[TAB]() + '<div class="err" id="err"></div></div>';
  document.querySelectorAll('.chip[data-t]').forEach(function(c){ c.onclick = function(){ TAB = c.dataset.t; paint(); }; });
  ({ month: bindMonth, tax: bindTax, nr: bindNR, rate: bindRate, all: function(){} })[TAB]();
}
/* ── 월 정산 ── */
function paneMonth(){
  var A = {}; AU.forEach(function(a){ A[a.user_id] = a; });
  var tot = function(k){ return SET.reduce(function(s, r){ return s + (+r[k] || 0); }, 0); };
  return '<div class="bar"><input class="in" type="month" id="pm" value="' + PERIOD + '" style="max-width:170px"><button class="btn" id="calc">① 이용료 계산하기</button>' +
    '<span class="note">지난달까지만 계산됩니다. 확정 전에는 몇 번이고 다시 계산할 수 있습니다.</span></div>' +
    (SET.length ? '<table class="t"><tr><th><input type="checkbox" id="all"></th><th>작가</th><th>종류</th><th>소득 구분</th><th class="n">과세표준</th><th class="n">수수료+부가세</th><th class="n">소득세</th><th class="n">지방소득세</th><th class="n">이체 금액</th><th>계좌 / PayPal</th><th>상태</th></tr>' +
      SET.map(function(r){ var a = A[r.author_id] || {}; var miss = r.tax_type === 'nonresident' ? !a.paypal_email : !(a.bank && a.rrn_last) && r.tax_type !== 'company';
        return '<tr><td><input type="checkbox" class="pk" value="' + r.id + '"></td><td>' + E(a.legal_name || a.display_name || '—') + '</td><td>' + (r.kind === 'license' ? '이용료' : '곡 거래') + '</td><td>' + TAX[r.tax_type] + (r.rate ? ' ' + (r.rate * 100) + '%' : '') + '</td><td class="n">' + n(r.gross_krw) + '</td><td class="n">' + n(+r.fee_krw + +r.fee_vat_krw) + '</td><td class="n">' + n(r.income_tax) + '</td><td class="n">' + n(r.local_tax) + '</td><td class="n"><b>' + n(r.net_krw) + '</b></td><td>' + (miss ? '<span class="tag coral">정산 정보 없음</span>' : E(r.tax_type === 'nonresident' ? a.paypal_email : a.bank || '')) + '</td><td>' + ST[r.status] + '</td></tr>'; }).join('') +
      '<tr><th></th><th colspan="3">합계 ' + SET.length + '건</th><th class="n">' + n(tot('gross_krw')) + '</th><th class="n">' + n(tot('fee_krw') + tot('fee_vat_krw')) + '</th><th class="n">' + n(tot('income_tax')) + '</th><th class="n">' + n(tot('local_tax')) + '</th><th class="n">' + n(tot('net_krw')) + '</th><th colspan="2"></th></tr></table>' +
      '<div class="bar"><b style="font-size:13px">고른 건:</b><button class="btn gold mini" data-s="confirmed">② 확정</button><button class="btn mini" data-s="paid">④ 지급 완료 표시</button><button class="btn mini" data-s="held">보류</button><button class="btn mini" data-s="failed">이체 실패</button><button class="btn mini" data-s="draft">확정 취소</button></div>' +
      '<div class="bar"><b style="font-size:13px">③ 내려받기 (확정된 건):</b><button class="btn mini" id="xbank">🏦 은행 대량이체 엑셀</button><button class="btn mini" id="xpp">🌐 PayPal 지급 목록</button><button class="btn mini" id="xtax">🧾 세무사용 (주민번호 포함)</button></div>' +
      '<div class="note">순서: ① 계산 → 내용 확인 → ② 확정(작가 화면에 「지급 예정」으로 보임) → ③ 은행 · PayPal 파일로 이체 → ④ 지급 완료 표시. 이체 실패 건은 「이체 실패」로 두고 계좌를 고친 뒤 다시 지급합니다.<br>은행 대량이체 엑셀은 기업뱅킹의 「대량이체 → 엑셀 올리기」 양식에 맞춰 열 순서만 맞추면 됩니다(은행마다 조금 다릅니다). 세무사용 파일은 주민번호가 들어 있으니 세무사에게만 전달하고 다 쓰면 지워 주세요(열어 본 기록이 남습니다).</div>'
      : '<p class="muted">이 달의 정산이 아직 없습니다. 「① 이용료 계산하기」를 누르세요.</p>');
}
function bindMonth(){
  $('pm').onchange = function(){ PERIOD = this.value; loadAll(); };
  $('calc').onclick = async function(){ var r = await CS.sb.rpc('cs_settle_month', { p_month: PERIOD + '-01' }), d = r.data || {};
    if (r.error || !d.ok) return msg(({ month_not_closed:'이번 달은 아직 끝나지 않아 계산할 수 없습니다.', already_confirmed:'이미 확정한 달입니다. 확정 취소 후 다시 계산하세요.' })[d.error] || ('계산하지 못했습니다: ' + (r.error ? r.error.message : d.error)));
    await loadAll(); msg(d.authors + '명 계산했습니다.', true); };
  if (!SET.length) return;
  $('all').onchange = function(){ var c = this.checked; document.querySelectorAll('.pk').forEach(function(x){ x.checked = c; }); };
  document.querySelectorAll('[data-s]').forEach(function(b){ b.onclick = async function(){
    var ids = [].slice.call(document.querySelectorAll('.pk:checked')).map(function(x){ return +x.value; }); if (!ids.length) return msg('먼저 건을 골라 주세요.');
    if (!confirm(ids.length + '건을 「' + ST[b.dataset.s] + '」로 바꿀까요?')) return;
    var r = await CS.sb.rpc('cs_settle_set', { p_ids: ids, p_status: b.dataset.s }); if (r.error || !r.data.ok) return msg('바꾸지 못했습니다.'); loadAll(); }; });
  var A = {}; AU.forEach(function(a){ A[a.user_id] = a; });
  var C = function(){ return SET.filter(function(r){ return r.status === 'confirmed'; }); };
  $('xbank').onclick = async function(){ var L = C().filter(function(r){ return r.tax_type !== 'nonresident'; }); if (!L.length) return msg('확정된 국내 건이 없습니다.');
    var info = await CS.sb.from('cs_payout_info').select('author_id,bank_name,bank_account,bank_holder').in('author_id', L.map(function(r){ return r.author_id; })); var I = {}; (info.data || []).forEach(function(x){ I[x.author_id] = x; });
    csv('첫소절_대량이체_' + PERIOD + '.csv', [['은행명','계좌번호','예금주','이체금액','받는분 통장 표시','내 통장 표시']].concat(L.map(function(r){ var x = I[r.author_id] || {}; return [x.bank_name, x.bank_account, x.bank_holder, r.net_krw, '첫소절정산' + PERIOD.replace('-', ''), (x.bank_holder || '') + ' 정산']; }))); };
  $('xpp').onclick = function(){ var L = C().filter(function(r){ return r.tax_type === 'nonresident'; }); if (!L.length) return msg('확정된 해외 건이 없습니다.');
    csv('cheotsojeol_paypal_' + PERIOD + '.csv', [['Email','Amount (KRW)','Currency','Note','Name','Country']].concat(L.map(function(r){ var a = A[r.author_id] || {}; return [a.paypal_email, r.net_krw, 'KRW', 'Cheotsojeol payout ' + PERIOD, a.legal_name, a.country]; }))); };
  $('xtax').onclick = async function(){ var L = C().concat(SET.filter(function(r){ return r.status === 'paid'; })); if (!L.length) return msg('확정 · 지급된 건이 없습니다.');
    if (!confirm('주민등록번호 · 여권번호가 들어간 파일을 내려받습니다. 세무 신고 용도로만 쓰고, 열어 본 기록이 남습니다. 계속할까요?')) return;
    var ids = L.map(function(r){ return r.author_id; }), rv = await CS.sb.rpc('cs_payout_reveal', { p_authors: ids, p_purpose: '원천징수 신고 ' + PERIOD });
    if (rv.error) return msg('불러오지 못했습니다: ' + rv.error.message); var P = {}; (rv.data || []).forEach(function(x){ P[x.author_id] = x; });
    csv('첫소절_원천징수_' + PERIOD + '.csv', [['지급월','소득구분','성명','주민등록번호/여권·TIN','국가','지급액(과세표준)','세율','소득세','지방소득세','실지급액','종류','상태']].concat(L.map(function(r){ var a = A[r.author_id] || {}, p = P[r.author_id] || {};
      return [PERIOD, TAX[r.tax_type], a.legal_name || a.display_name, r.tax_type === 'nonresident' ? p.tin : p.rrn, a.country || 'KR', r.gross_krw, r.tax_type === 'nonresident' ? (r.rate || 0.2) : ({ business:0.03, other_income:'(필요경비60%)×20%', company:0 })[r.tax_type], r.income_tax, r.local_tax, r.net_krw, r.kind === 'license' ? '저작물 이용료' : '곡 거래', ST[r.status]]; }))); };
}
/* ── 소득 구분 승인 ── */
function paneTax(){
  var L = AU.filter(function(a){ return a.tax_status === 'pending'; });
  return '<div class="note" style="margin-bottom:8px">작가가 기타소득 · 사업자를 고르면 여기에 옵니다. 승인 전에는 사업소득 3.3%로 계산합니다. 등록곡 · 정산 횟수가 많거나 매달 꾸준히 지급되는 작가는 계속 · 반복적 활동으로 보아 사업소득으로 전환하는 것이 안전합니다.</div>' +
    (L.length ? '<table class="t"><tr><th>작가</th><th>요청</th><th>요청일</th><th class="n">등록곡</th><th class="n">공개곡</th><th class="n">정산 횟수</th><th class="n">최근 3개월 지급</th><th>사업자 서류</th><th></th></tr>' +
      L.map(function(a){ return '<tr><td>' + E(a.display_name) + '<br><span class="faint">' + E(a.nickname) + '</span></td><td><b>' + TAX[a.tax_requested] + '</b></td><td>' + (a.tax_declared_at || '').slice(0, 10) + '</td><td class="n">' + a.songs + '</td><td class="n">' + a.listed + '</td><td class="n">' + a.settlements + '</td><td class="n">' + n(a.paid_3m) + '</td><td>' + (a.tax_requested === 'company' ? (a.biz_cert_path ? '<a href="#" class="doc" data-p="' + E(a.biz_cert_path) + '" style="color:var(--gold)">등록증 보기</a> · ' + E(a.biz_no || '') : '<span class="tag coral">없음</span>') : '—') + '</td>' +
        '<td><button class="btn gold mini" data-ok="' + a.user_id + '">승인</button> <button class="btn mini" data-no="' + a.user_id + '">반려 → 사업소득</button></td></tr>'; }).join('') + '</table>' : '<p class="muted">승인 대기 중인 요청이 없습니다.</p>');
}
function bindTax(){
  document.querySelectorAll('.doc').forEach(function(x){ x.onclick = async function(){ var u = await signed(x.dataset.p); if (u) window.open(u, '_blank'); return false; }; });
  document.querySelectorAll('[data-ok],[data-no]').forEach(function(b){ b.onclick = async function(){ var ok = !!b.dataset.ok, id = b.dataset.ok || b.dataset.no;
    var note = prompt(ok ? '승인 메모(선택):' : '반려 이유(작가에게 보입니다):', ok ? '' : '계속 · 반복적 등록으로 사업소득 적용'); if (note === null) return;
    var r = await CS.sb.rpc('cs_tax_decide', { p_author: id, p_approve: ok, p_note: note || null }), d = r.data || {};
    if (r.error || !d.ok) return msg(d.error === 'biz_cert_needed' ? '사업자등록번호와 등록증이 있어야 승인할 수 있습니다.' : '처리하지 못했습니다: ' + (r.error ? r.error.message : d.error)); loadAll(); }; });
}
/* ── 해외 작가 서류 ── */
function paneNR(){
  var L = AU.filter(function(a){ return a.tax_type === 'nonresident'; }), R = {}; RATES.forEach(function(r){ R[r.country] = r; });
  return '<div class="note" style="margin-bottom:8px">해외 거주 작가는 기본 22%(20%+2%)입니다. 거주자증명서와 제한세율 적용신청서를 확인하고 「승인」하면 나라별 세율표의 세율이 적용됩니다. 서류는 국세청 요구에 대비해 보관됩니다(받은 날 기준으로 재제출 시기를 관리하세요).</div>' +
    (L.length ? '<table class="t"><tr><th>작가</th><th>국가</th><th>조약 세율</th><th>여권 · TIN</th><th>PayPal</th><th>거주자증명서</th><th>제한세율 신청서</th><th>받은 날</th><th>상태</th><th></th></tr>' +
      L.map(function(a){ var r = R[a.country]; return '<tr><td>' + E(a.legal_name || a.display_name) + '</td><td>' + E(a.country || '—') + '</td><td>' + (r ? (r.income_rate * 100) + '% (+지방 ' + (r.income_rate * 10) + '%)' : '<span class="tag coral">세율표 없음</span>') + '</td><td>' + E(a.tin_last || '—') + '</td><td>' + E(a.paypal_email || '—') + '</td>' +
        '<td>' + (a.residence_cert_path ? '<a href="#" class="doc" data-p="' + E(a.residence_cert_path) + '" style="color:var(--gold)">보기</a>' : '—') + '</td><td>' + (a.treaty_form_path ? '<a href="#" class="doc" data-p="' + E(a.treaty_form_path) + '" style="color:var(--gold)">보기</a>' : '—') + '</td><td>' + (a.docs_at || '').slice(0, 10) + '</td>' +
        '<td>' + ({ none:'서류 없음', pending:'<b style="color:var(--gold)">확인 대기</b>', approved:'승인', rejected:'반려' })[a.treaty_status || 'none'] + '</td><td>' + (a.treaty_status === 'pending' || a.treaty_status === 'approved' ? '<button class="btn gold mini" data-tok="' + a.user_id + '">승인</button> <button class="btn mini" data-tno="' + a.user_id + '">반려(22%)</button>' : '') + '</td></tr>'; }).join('') + '</table>' : '<p class="muted">해외 거주 작가가 아직 없습니다.</p>');
}
function bindNR(){
  document.querySelectorAll('.doc').forEach(function(x){ x.onclick = async function(){ var u = await signed(x.dataset.p); if (u) window.open(u, '_blank'); return false; }; });
  document.querySelectorAll('[data-tok],[data-tno]').forEach(function(b){ b.onclick = async function(){ var ok = !!b.dataset.tok, id = b.dataset.tok || b.dataset.tno;
    var note = prompt(ok ? '메모(선택, 예: 증명서 2026년 발급):' : '반려 이유(작가에게 보입니다):', ''); if (note === null) return;
    var r = await CS.sb.rpc('cs_treaty_decide', { p_author: id, p_approve: ok, p_note: note || null }), d = r.data || {};
    if (r.error || !d.ok) return msg(d.error === 'docs_or_rate_missing' ? '서류 두 가지와 그 나라 세율표가 있어야 승인할 수 있습니다.' : '처리하지 못했습니다.'); loadAll(); }; });
}
/* ── 나라별 세율표 ── */
function paneRate(){
  return '<div class="note" style="margin-bottom:8px">조세조약의 사용료(로열티) 제한세율을 세무 담당자에게 확인한 뒤 넣어 주세요. 소득세 몫만 넣으면 지방소득세(그 10%)는 자동으로 더해집니다. 예) 10% → 소득세 10% + 지방 1%.</div>' +
    '<table class="t"><tr><th>국가코드</th><th>나라</th><th class="n">소득세율</th><th>메모</th><th></th></tr>' + RATES.map(function(r){ return '<tr><td>' + E(r.country) + '</td><td>' + E(r.name) + '</td><td class="n">' + (r.income_rate * 100) + '%</td><td>' + E(r.note || '') + '</td><td><button class="btn mini" data-del="' + E(r.country) + '">지우기</button></td></tr>'; }).join('') +
    '<tr><td><input class="in" id="rc" maxlength="2" placeholder="US" style="width:70px"></td><td><input class="in" id="rn" placeholder="미국" style="width:120px"></td><td><input class="in" id="rr" inputmode="decimal" placeholder="10" style="width:80px"> %</td><td><input class="in" id="rm" placeholder="확인한 날 · 근거" style="width:200px"></td><td><button class="btn gold mini" id="radd">저장</button></td></tr></table>';
}
function bindRate(){
  $('radd').onclick = async function(){ var c = $('rc').value.trim().toUpperCase(), rr = parseFloat($('rr').value); if (!/^[A-Z]{2}$/.test(c) || !(rr >= 0 && rr <= 20) || !$('rn').value.trim()) return msg('국가코드 2글자, 나라 이름, 0~20% 세율을 넣어 주세요.');
    var r = await CS.sb.rpc('cs_rate_save', { p_country: c, p_name: $('rn').value.trim(), p_rate: rr / 100, p_note: $('rm').value.trim() || null, p_delete: false }); if (r.error || !r.data.ok) return msg('저장하지 못했습니다.'); loadAll(); };
  document.querySelectorAll('[data-del]').forEach(function(b){ b.onclick = async function(){ if (!confirm(b.dataset.del + ' 세율을 지울까요?')) return; await CS.sb.rpc('cs_rate_save', { p_country: b.dataset.del, p_name: '', p_rate: 0, p_note: null, p_delete: true }); loadAll(); }; });
}
/* ── 작가 세무 정보 ── */
function paneAll(){
  return '<table class="t"><tr><th>작가</th><th>적용 구분</th><th>요청 · 상태</th><th>실명</th><th>주민번호</th><th>계좌</th><th>사업자</th><th>국가 · PayPal</th><th class="n">등록곡</th><th class="n">정산</th></tr>' +
    AU.map(function(a){ return '<tr><td>' + E(a.display_name) + '</td><td>' + TAX[a.tax_type] + '</td><td>' + (a.tax_requested ? TAX[a.tax_requested] + ' · ' + ({ pending:'대기', approved:'승인', rejected:'반려' })[a.tax_status] : '—') + '</td><td>' + E(a.legal_name || '—') + '</td><td>' + E(a.rrn_last || '—') + '</td><td>' + E(a.bank || '—') + '</td><td>' + E(a.biz_no || '—') + '</td><td>' + E([a.country, a.paypal_email].filter(Boolean).join(' · ') || '—') + '</td><td class="n">' + a.songs + '</td><td class="n">' + a.settlements + '</td></tr>'; }).join('') + '</table>';
}
(async function(){
  ME = await CS.needLogin(); if (!ME) return;
  if (ME.profile.role !== 'admin') { $('app').innerHTML = '<div class="card" style="padding:22px">관리자만 볼 수 있는 화면입니다.</div>'; return; }
  loadAll();
})();
</script></body></html>
